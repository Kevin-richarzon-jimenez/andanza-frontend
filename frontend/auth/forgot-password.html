<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/favicon.ico" sizes="any">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Recuperar contraseña — Andanza</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Sora:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/base.css">
<link rel="stylesheet" href="/css/layout.css">
<link rel="stylesheet" href="/css/components.css">
<link rel="stylesheet" href="/css/pages/auth.css">
<script defer src="/js/components.js"></script>
<script defer src="/js/pages/auth.js"></script>
</head>
<body>

<main class="auth-split">
  <div class="auth-form">
    <a href="/index.html" class="site-logo">andanza<span>.</span></a>
    <h1>Recupera tu contraseña</h1>
    <p class="subtitle">Ingresa tu correo y te enviaremos un enlace para crear una nueva contraseña.</p>

    <form id="forgot-password-form">
      <div class="field-group">
        <label for="email">Correo electrónico</label>
        <input type="email" id="email" name="email" autocomplete="email" required>
      </div>
      <button type="submit" class="btn btn-fill">Enviar enlace</button>
      <p class="form-feedback" hidden></p>
    </form>

    <div class="auth-links">¿Ya la recordaste? <a href="/auth/login.html">Inicia sesión</a></div>
  </div>
  <div class="auth-visual">
    <div class="placeholder">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="8.5" cy="10" r="1.4"/><path d="M21 15l-5-5-4 4-3-3-6 6"/></svg>
      <span>[imagen]</span>
    </div>
  </div>
</main>

</body>
</html>
