<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/favicon.ico" sizes="any">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Crear cuenta — Andanza</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Sora:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/base.css">
<link rel="stylesheet" href="/css/layout.css">
<link rel="stylesheet" href="/css/components.css">
<link rel="stylesheet" href="/css/pages/auth.css">
<script defer src="/js/pages/auth.js"></script>
</head>
<body>

<main class="auth-split">
  <div class="auth-form">
    <a href="/index.html" class="site-logo">andanza<span>.</span></a>
    <h1>Crea tu cuenta</h1>
    <p class="subtitle">Guarda tus tallas, tus direcciones y sigue tus pedidos.</p>

    <form id="register-form">
      <div class="field-row">
        <div class="field-group">
          <label for="first-name">Nombre</label>
          <input type="text" id="first-name" name="first-name" autocomplete="given-name" required>
        </div>
        <div class="field-group">
          <label for="last-name">Apellido</label>
          <input type="text" id="last-name" name="last-name" autocomplete="family-name" required>
        </div>
      </div>
      <div class="field-group">
        <label for="email">Correo electrónico</label>
        <input type="email" id="email" name="email" autocomplete="email" required>
      </div>
      <div class="field-group">
        <label for="password">Contraseña</label>
        <input type="password" id="password" name="password" autocomplete="new-password" required minlength="8">
      </div>
      <div class="field-group">
        <label for="confirm-password">Confirmar contraseña</label>
        <input type="password" id="confirm-password" name="confirm-password" autocomplete="new-password" required minlength="8">
      </div>
      <label class="auth-check">
        <input type="checkbox" required>
        Acepto los términos y condiciones
      </label>
      <button type="submit" class="btn btn-fill">Crear cuenta</button>
    </form>

    <div class="auth-links">¿Ya tienes cuenta? <a href="/auth/login.html">Inicia sesión</a></div>
  </div>
  <div class="auth-visual">
    <div class="placeholder">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="8.5" cy="10" r="1.4"/><path d="M21 15l-5-5-4 4-3-3-6 6"/></svg>
      <span>[imagen]</span>
    </div>
  </div>
</main>

</body>
</html>
