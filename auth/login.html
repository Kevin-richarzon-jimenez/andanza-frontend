<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/favicon.ico" sizes="any">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Iniciar sesión — Andanza</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Sora:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/base.css">
<link rel="stylesheet" href="/css/layout.css">
<link rel="stylesheet" href="/css/components.css">
<link rel="stylesheet" href="/css/pages/auth.css">
<script defer src="/js/pages/auth.js"></script>
</head>
<body>

<main class="auth-split">
  <div class="auth-form">
    <a href="/index.html" class="site-logo">andanza<span>.</span></a>
    <h1>Bienvenido de nuevo</h1>
    <p class="subtitle">Inicia sesión para ver tus favoritos, tus pedidos y tus direcciones guardadas.</p>

    <form id="login-form">
      <div class="field-group">
        <label for="email">Correo electrónico</label>
        <input type="email" id="email" name="email" autocomplete="email" required>
      </div>
      <div class="field-group">
        <label for="password">Contraseña</label>
        <input type="password" id="password" name="password" autocomplete="current-password" required>
      </div>
      <div class="auth-links"><a href="/auth/forgot-password.html">¿Olvidaste tu contraseña?</a></div>
      <button type="submit" class="btn btn-fill">Iniciar sesión</button>
    </form>

    <div class="auth-divider"><div class="line"></div>o<div class="line"></div></div>
    <button type="button" class="btn btn-outline" style="width:100%;">Continuar con Google</button>
    <div class="auth-links">¿No tienes cuenta? <a href="/auth/register.html">Regístrate</a></div>
  </div>
  <div class="auth-visual">
    <div class="placeholder">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="8.5" cy="10" r="1.4"/><path d="M21 15l-5-5-4 4-3-3-6 6"/></svg>
      <span>[imagen]</span>
    </div>
  </div>
</main>

</body>
</html>
